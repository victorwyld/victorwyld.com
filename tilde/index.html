<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TILDE | Victor Wyld</title>

  <meta name="description" content="TILDE by Victor Wyld.">
  <meta name="author" content="Victor Wyld">

  <link rel="canonical" href="https://victorwyld.com/tilde/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <meta property="og:title" content="TILDE | Victor Wyld">
  <meta property="og:description" content="TILDE by Victor Wyld.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://victorwyld.com/tilde/">
  <meta property="og:site_name" content="Victor Wyld">
  <meta property="og:locale" content="en_CA">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TILDE | Victor Wyld">
  <meta name="twitter:description" content="TILDE by Victor Wyld.">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #111111;
    }

    .stage {
      position: fixed;
      inset: 0;
      background: #ffffff;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
    }

    /* =========================
       FIRST TILDE
    ========================== */

    .title-first {
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: 0.16em;
      line-height: 1;
      transform: translateY(-4vh);

      animation:
        fadeIn 3.5s ease 1s forwards,
        fadeOut 3.5s ease 7.5s forwards;
    }

    /* =========================
       CENTER ~
    ========================== */

    .symbol {
      font-size: 48rem;
      font-weight: normal;
      line-height: 1;
      transform: translateY(-9vh);

      animation:
        fadeIn 3.5s ease 10.5s forwards,
        fadeOut 3.5s ease 17s forwards;
    }

    /* =========================
       SECOND TILDE
    ========================== */

    .title-second {
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: 0.16em;
      line-height: 1;
      transform: translateY(-4vh);

      animation:
        fadeIn 3.5s ease 20.5s forwards,
        fadeOut 3.5s ease 27s forwards;
    }

    /* =========================
       FINAL COVER
    ========================== */

    .cover {
      flex-direction: column;
      text-align: center;

      animation: fadeIn 3.5s ease 30s forwards;
    }

    .cover-symbol {
      font-size: 48rem;
      font-weight: normal;
      line-height: 0.9;
      transform: translateY(-4vh);
      margin: 0;
    }

    .cover-byline {
      margin: -1.5rem 0 0;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    .cover-byline a {
      color: inherit;
      text-decoration: none;
      opacity: 0.72;
      transition: opacity 0.3s ease;
    }

    .cover-byline a:hover,
    .cover-byline a:focus-visible {
      opacity: 1;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {
      .title-first,
      .title-second {
        font-size: 3rem;
        letter-spacing: 0.13em;
        transform: translateY(-3vh);
      }

      .symbol,
      .cover-symbol {
        font-size: 24rem;
        transform: translateY(-3vh);
      }

      .cover-byline {
        margin-top: -0.5rem;
        font-size: 0.92rem;
      }
    }

    /* =========================
       REDUCED MOTION
    ========================== */

    @media (prefers-reduced-motion: reduce) {
      .title-first,
      .symbol,
      .title-second {
        display: none;
      }

      .cover {
        opacity: 1;
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="stage">

    <div class="screen title-first">
      TILDE
    </div>

    <div class="screen symbol" aria-hidden="true">
      ~
    </div>

    <div class="screen title-second">
      TILDE
    </div>

    <div class="screen cover">
      <p class="cover-symbol" aria-hidden="true">~</p>
      <p class="cover-byline">
        <a href="/">by Victor Wyld</a>
      </p>
    </div>

  </main>
</body>
</html>
