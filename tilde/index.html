<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TILDE | Victor Wyld</title>

  <meta name="description" content="TILDE.">
  <meta name="author" content="Victor Wyld">

  <link rel="canonical" href="https://victorwyld.com/tilde/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <meta property="og:title" content="TILDE | Victor Wyld">
  <meta property="og:description" content="TILDE.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://victorwyld.com/tilde/">
  <meta property="og:site_name" content="Victor Wyld">
  <meta property="og:locale" content="en_CA">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #111111;
    }

    .stage {
      position: fixed;
      inset: 0;
      background: #ffffff;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
    }

    /* =========================
       FIRST TILDE
    ========================== */

    .title-first {
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: 0.16em;
      line-height: 1;

      transform: translateY(-4vh);

      animation:
        firstTitleIn 3.5s ease 1s forwards,
        firstTitleOut 3.5s ease 7.5s forwards;
    }

    /* =========================
       ~
    ========================== */

    .symbol {
      font-size: 48rem;
      font-weight: normal;
      line-height: 1;

      transform: translateY(-9vh);

      animation:
        symbolIn 3.5s ease 10.5s forwards,
        symbolOut 3.5s ease 17s forwards;
    }

    /* =========================
       FINAL TILDE
    ========================== */

    .title-final {
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: 0.16em;
      line-height: 1;

      transform: translateY(-4vh);

      animation: finalTitleIn 3.5s ease 20.5s forwards;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes firstTitleIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes firstTitleOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes symbolIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes symbolOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes finalTitleIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {
      .title-first,
      .title-final {
        font-size: 3rem;
        letter-spacing: 0.13em;
        transform: translateY(-3vh);
      }

      .symbol {
        font-size: 24rem;
        transform: translateY(-6vh);
      }
    }

    /* =========================
       REDUCED MOTION
    ========================== */

    @media (prefers-reduced-motion: reduce) {
      .title-first,
      .symbol {
        display: none;
      }

      .title-final {
        opacity: 1;
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="stage">

    <div class="screen title-first">
      TILDE
    </div>

    <div class="screen symbol" aria-hidden="true">
      ~
    </div>

    <div class="screen title-final">
      TILDE
    </div>

  </main>

</body>
</html>
